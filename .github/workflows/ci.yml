name: checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Least privilege: these jobs only read the repo.
permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      # Pinned to a commit SHA, not a mutable tag. A tag can be moved;
      # a SHA cannot. This is the same control our Services page sells.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Site checks
        run: node scripts/check.js

      - name: Physics regression tests
        run: node scripts/physics-test.js

      - name: Assert zero dependencies
        run: |
          deps=$(node -p "Object.keys(require('./package.json').dependencies||{}).length")
          dev=$(node -p "Object.keys(require('./package.json').devDependencies||{}).length")
          echo "runtime=$deps dev=$dev"
          if [ "$deps" != "0" ] || [ "$dev" != "0" ]; then
            echo "::error::Dependencies were introduced. This site ships with none by design."
            exit 1
          fi

      - name: Assert no third-party requests
        run: |
          if grep -rlE 'fonts\.googleapis|fonts\.gstatic|googletagmanager|google-analytics|cdn\.jsdelivr|unpkg\.com' --include='*.html' --include='*.css' .; then
            echo "::error::A third-party origin was introduced. The privacy notice states there are none."
            exit 1
          fi
          echo "no third-party origins"
